# Manual worker run (the path to use when KEDA is not installed, and for the first functional test).
# One Job = one BOUNDED run: at most *_WORKER_MAX_MESSAGES messages or *_WORKER_MAX_RUNTIME_SECONDS,
# exits 0 when the queues stay empty for *_IDLE_EXIT_SECONDS. Jobs are immutable, so replace the previous one:
#   oc -n <ns> delete job statements-worker-manual --ignore-not-found
#   oc -n <ns> apply -k deploy/openshift/overlays/<env>/worker-statements
# activeDeadlineSeconds > max runtime + one task; terminationGracePeriodSeconds lets the task in hand finish.
apiVersion: batch/v1
kind: Job
metadata:
  name: statements-worker-manual
  labels:
    app.kubernetes.io/part-of: nvb-digital
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statements-worker
        app.kubernetes.io/part-of: nvb-digital
        nvb.io/component: statements-worker
    spec:
      serviceAccountName: statements-worker
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: statements-worker
        image: nvb-statements
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "nvb_statements.worker", "--drain"]
        envFrom:
        - configMapRef:
            name: statements-config
        env:
        - name: STATEMENTS_DATABASE_PASSWORD_FILE
          value: "/var/run/secrets/nvb/db/password"
        - name: STATEMENTS_ADAPTER_TOKEN_FILE
          value: "/var/run/secrets/nvb/adapter/token"
        - name: STATEMENTS_ADAPTER_CA_FILE
          value: "/etc/nvb/service-ca/service-ca.crt"
        - name: STATEMENTS_BROKER_USERNAME_FILE
          value: "/var/run/secrets/nvb/broker/username"
        - name: STATEMENTS_BROKER_PASSWORD_FILE
          value: "/var/run/secrets/nvb/broker/password"
        - name: STATEMENTS_S3_ACCESS_KEY_FILE
          value: "/var/run/secrets/nvb/s3/access-key"
        - name: STATEMENTS_S3_SECRET_KEY_FILE
          value: "/var/run/secrets/nvb/s3/secret-key"
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 1, memory: 768Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: db
          mountPath: /var/run/secrets/nvb/db
          readOnly: true
        - name: adapter-token
          mountPath: /var/run/secrets/nvb/adapter
          readOnly: true
        - name: broker
          mountPath: /var/run/secrets/nvb/broker
          readOnly: true
        - name: s3
          mountPath: /var/run/secrets/nvb/s3
          readOnly: true
        - name: service-ca
          mountPath: /etc/nvb/service-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: db
        secret:
          secretName: statements-db-app
          defaultMode: 0440
      - name: adapter-token
        secret:
          secretName: adapter-token-statements-worker
          defaultMode: 0440
      - name: broker
        secret:
          secretName: statements-broker
          defaultMode: 0440
      - name: s3
        secret:
          secretName: statements-s3
          defaultMode: 0440
      - name: service-ca
        configMap:
          name: nvb-service-ca
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
