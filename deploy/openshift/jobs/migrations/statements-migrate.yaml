apiVersion: batch/v1
kind: Job
metadata:
  name: statements-migrate
  labels:
    app.kubernetes.io/part-of: nvb-digital
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statements-ops
        app.kubernetes.io/part-of: nvb-digital
        nvb.io/component: statements-ops
    spec:
      serviceAccountName: statements-ops
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: statements-ops
        image: nvb-statements
        imagePullPolicy: IfNotPresent
        command: ["alembic", "-c", "/opt/app/migrations/statements/alembic.ini", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: statements-migration-config
        env:
        - name: STATEMENTS_MIGRATION_PASSWORD_FILE
          value: "/var/run/secrets/nvb/db/password"
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: db
          mountPath: /var/run/secrets/nvb/db
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: db
        secret:
          secretName: statements-db-owner
          defaultMode: 0440
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
