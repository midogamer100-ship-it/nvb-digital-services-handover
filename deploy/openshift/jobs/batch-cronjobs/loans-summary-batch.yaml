# Daily refresh of the synthetic summaries for applications that are open for review.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loans-summary-batch
  labels:
    app.kubernetes.io/part-of: nvb-digital
spec:
  schedule: "15 3 * * *"
  timeZone: Africa/Cairo
  suspend: true            # enable deliberately (runbook step 13): oc patch cronjob/loans-summary-batch -p '{"spec":{"suspend":false}}'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3            # the command is idempotent and resumable (same idempotency key)
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loans-ops
            app.kubernetes.io/part-of: nvb-digital
            nvb.io/component: loans-ops
        spec:
          serviceAccountName: loans-ops
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: loans-ops
            image: nvb-loans
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "nvb_loans.relay", "batch-create", "--trigger", "schedule"]
            envFrom:
            - configMapRef:
                name: loans-config
            env:
            - name: LOANS_DATABASE_PASSWORD_FILE
              value: "/var/run/secrets/nvb/db/password"
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits: {cpu: 250m, memory: 256Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: db
              mountPath: /var/run/secrets/nvb/db
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: db
            secret:
              secretName: loans-db-app
              defaultMode: 0440
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
