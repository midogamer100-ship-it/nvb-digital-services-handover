# One ServiceAccount per component, no RoleBindings: the workloads never call the Kubernetes API
# (automountServiceAccountToken is false everywhere). They run under the default restricted-v2 SCC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-adapter
  labels:
    app.kubernetes.io/part-of: nvb-digital
automountServiceAccountToken: false
