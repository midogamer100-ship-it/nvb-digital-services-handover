# statements-api (Deployment + Service) and statements-relay (Deployment, no Service).
# The relay publishes the transactional outbox to RabbitMQ, DECLARES the queues and reconciles
# abandoned tasks: without it nothing is ever processed. Workers are Jobs (see ../jobs, ../autoscaling-keda).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statements-api
  labels:
    app.kubernetes.io/name: statements-api
    app.kubernetes.io/part-of: nvb-digital
    nvb.io/component: statements-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      nvb.io/component: statements-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statements-api
        app.kubernetes.io/part-of: nvb-digital
        nvb.io/component: statements-api
    spec:
      serviceAccountName: statements-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: statements-api
        image: nvb-statements
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: statements-config
        env:
        - name: UVICORN_SSL_CERTFILE
          value: "/etc/nvb/tls/tls.crt"
        - name: UVICORN_SSL_KEYFILE
          value: "/etc/nvb/tls/tls.key"
        - name: STATEMENTS_DATABASE_PASSWORD_FILE
          value: "/var/run/secrets/nvb/db/password"
        - name: STATEMENTS_ADAPTER_TOKEN_FILE
          value: "/var/run/secrets/nvb/adapter/token"
        - name: STATEMENTS_ADAPTER_CA_FILE
          value: "/etc/nvb/service-ca/service-ca.crt"
        - name: STATEMENTS_S3_ACCESS_KEY_FILE
          value: "/var/run/secrets/nvb/s3/access-key"
        - name: STATEMENTS_S3_SECRET_KEY_FILE
          value: "/var/run/secrets/nvb/s3/secret-key"
        startupProbe:
          httpGet: {path: /health/live, port: https, scheme: HTTPS}
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet: {path: /health/live, port: https, scheme: HTTPS}
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet: {path: /health/ready, port: https, scheme: HTTPS}
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 160Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tls
          mountPath: /etc/nvb/tls
          readOnly: true
        - name: db
          mountPath: /var/run/secrets/nvb/db
          readOnly: true
        - name: adapter-token
          mountPath: /var/run/secrets/nvb/adapter
          readOnly: true
        - name: s3
          mountPath: /var/run/secrets/nvb/s3
          readOnly: true
        - name: service-ca
          mountPath: /etc/nvb/service-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tls
        secret:
          secretName: statements-api-tls
          defaultMode: 0440
      - name: db
        secret:
          secretName: statements-db-app
          defaultMode: 0440
      - name: adapter-token
        secret:
          secretName: adapter-token-statements-api
          defaultMode: 0440
      - name: s3
        secret:
          secretName: statements-s3
          defaultMode: 0440
      - name: service-ca
        configMap:
          name: nvb-service-ca
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: statements-api
  labels:
    app.kubernetes.io/name: statements-api
    app.kubernetes.io/part-of: nvb-digital
    nvb.io/component: statements-api
  annotations:
    # OpenShift service CA issues statements-api-tls for statements-api.<namespace>.svc (no operator to install).
    service.beta.openshift.io/serving-cert-secret-name: statements-api-tls
spec:
  selector:
    nvb.io/component: statements-api
  ports:
  - name: https
    port: 8443
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statements-relay
  labels:
    app.kubernetes.io/name: statements-relay
    app.kubernetes.io/part-of: nvb-digital
    nvb.io/component: statements-relay
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      nvb.io/component: statements-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statements-relay
        app.kubernetes.io/part-of: nvb-digital
        nvb.io/component: statements-relay
    spec:
      serviceAccountName: statements-relay
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: statements-relay
        image: nvb-statements
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "nvb_statements.relay"]
        envFrom:
        - configMapRef:
            name: statements-config
        env:
        - name: STATEMENTS_DATABASE_PASSWORD_FILE
          value: "/var/run/secrets/nvb/db/password"
        - name: STATEMENTS_BROKER_USERNAME_FILE
          value: "/var/run/secrets/nvb/broker/username"
        - name: STATEMENTS_BROKER_PASSWORD_FILE
          value: "/var/run/secrets/nvb/broker/password"
        - name: STATEMENTS_RELAY_HEARTBEAT_FILE
          value: "/tmp/relay-heartbeat"
        livenessProbe:
          exec:
            command: ["python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/relay-heartbeat') < 180 else 1)"]
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 250m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: db
          mountPath: /var/run/secrets/nvb/db
          readOnly: true
        - name: broker
          mountPath: /var/run/secrets/nvb/broker
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: db
        secret:
          secretName: statements-db-app
          defaultMode: 0440
      - name: broker
        secret:
          secretName: statements-broker
          defaultMode: 0440
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
