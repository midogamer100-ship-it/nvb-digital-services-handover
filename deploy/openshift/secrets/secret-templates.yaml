# SHAPE ONLY - placeholders, never real values. Do not apply this file: create the Secrets with
# the commands written by scripts/generate_credentials.py (values come from local files).
# It is intentionally NOT referenced by any kustomization.
apiVersion: v1
kind: Secret
metadata: {name: core-adapter-core-token}
type: Opaque
stringData:
  token: "REPLACE_WITH_GENERATED_TOKEN"            # >= 32 characters; the adapter refuses shorter tokens
---
apiVersion: v1
kind: Secret
metadata: {name: core-adapter-clients}
type: Opaque
stringData:
  clients.json: |
    {"clients": [
      {"client_id": "statements-api",    "token_sha256": ["REPLACE_SHA256_HEX"], "scopes": ["identity:resolve", "accounts:read", "discovery:read"]},
      {"client_id": "statements-worker", "token_sha256": ["REPLACE_SHA256_HEX"], "scopes": ["statements:read"]},
      {"client_id": "statements-batch",  "token_sha256": ["REPLACE_SHA256_HEX"], "scopes": ["discovery:read"]},
      {"client_id": "loans-api",         "token_sha256": ["REPLACE_SHA256_HEX"], "scopes": ["identity:resolve", "accounts:read"]},
      {"client_id": "loans-worker",      "token_sha256": ["REPLACE_SHA256_HEX"], "scopes": ["summaries:read"]}
    ]}
---
apiVersion: v1
kind: Secret
metadata: {name: adapter-token-statements-api}     # same shape: adapter-token-statements-worker, -statements-batch, -loans-api, -loans-worker
type: Opaque
stringData:
  token: "REPLACE_WITH_GENERATED_TOKEN"
---
apiVersion: v1
kind: Secret
metadata: {name: statements-db-app}                # same shape: statements-db-owner, loans-db-app, loans-db-owner
type: Opaque
stringData:
  password: "REPLACE_WITH_GENERATED_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata: {name: statements-broker}                # same shape: loans-broker
type: Opaque
stringData:
  username: "nvb_statements"
  password: "REPLACE_WITH_GENERATED_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata: {name: statements-s3}
type: Opaque
stringData:
  access-key: "REPLACE_WITH_ACCESS_KEY"
  secret-key: "REPLACE_WITH_SECRET_KEY"
---
apiVersion: v1
kind: Secret
metadata: {name: keda-rabbitmq}                    # optional (KEDA only)
type: Opaque
stringData:
  host: "amqps://nvb_monitor:REPLACE_PASSWORD@REPLACE_RABBITMQ_HOST:5671/nvb"
