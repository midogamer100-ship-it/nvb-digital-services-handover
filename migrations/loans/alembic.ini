# Loans extension migrations. Run ONLY as a controlled one-off step (OpenShift Job / operator),
# never at API or worker startup:
#   LOANS_MIGRATION_DATABASE_URL=postgresql+psycopg://owner@host/nvb_loans \
#   LOANS_MIGRATION_PASSWORD_FILE=/var/run/secrets/loans-db-owner/password \
#   LOANS_APP_ROLE=nvb_loans_app  alembic -c migrations/loans/alembic.ini upgrade head
[alembic]
script_location = %(here)s
version_table = alembic_version_loans

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = INFO
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
