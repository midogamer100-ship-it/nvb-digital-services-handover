# Statements extension migrations. Run ONLY as a controlled one-off step (OpenShift Job / operator),
# never at API or worker startup:
#   STATEMENTS_MIGRATION_DATABASE_URL=postgresql+psycopg://owner@host/nvb_statements \
#   STATEMENTS_MIGRATION_PASSWORD_FILE=/var/run/secrets/statements-db-owner/password \
#   STATEMENTS_APP_ROLE=nvb_statements_app  alembic -c migrations/statements/alembic.ini upgrade head
[alembic]
script_location = %(here)s
version_table = alembic_version_statements

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = INFO
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
